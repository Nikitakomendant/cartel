services:
  cartel:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"   # only nginx on the same server can reach the app
    volumes:
      - ./data:/app/data        # database, private CVs, backups
      - ./uploads:/app/uploads  # public photos and videos
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
