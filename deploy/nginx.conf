# /etc/nginx/sites-available/cartel.ua — HTTPS via certbot (Let's Encrypt)
limit_req_zone $binary_remote_addr zone=cartel_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cartel_conn:10m;

server {
    listen 80;
    server_name cartel.ua www.cartel.ua;
    return 301 https://cartel.ua$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.cartel.ua;
    ssl_certificate     /etc/letsencrypt/live/cartel.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartel.ua/privkey.pem;
    return 301 https://cartel.ua$request_uri;
}
server {
    listen 443 ssl http2;
    server_name cartel.ua;
    ssl_certificate     /etc/letsencrypt/live/cartel.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartel.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;

    client_max_body_size 210m;        # video uploads in CMS
    client_body_timeout 60s;
    send_timeout 60s;
    limit_conn cartel_conn 40;

    location / {
        limit_req zone=cartel_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # static assets are fingerprinted — let nginx cache them
    location /static/ { proxy_pass http://127.0.0.1:3000; expires 365d; access_log off; }
    location /media/  { proxy_pass http://127.0.0.1:3000; expires 30d;  access_log off; }
}
